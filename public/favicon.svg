<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sutiles sombras para darle profundidad al estilo "app/material" -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo Base con Esquinas Redondeadas (Representando el Tablero) -->
  <rect width="512" height="512" rx="112" fill="#1e1b4b" />

  <g filter="url(#shadow)">
    <!-- Bloque Superior Izquierdo (Naranja - "3") -->
    <rect x="48" y="48" width="128" height="128" rx="28" fill="#f97316" />
    <text x="112" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Bloque Superior Centro (Turquesa - "5") -->
    <rect x="192" y="48" width="128" height="128" rx="28" fill="#14b8a6" />
    <text x="256" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#ffffff" text-anchor="middle">5</text>

    <!-- Bloque Superior Derecho (Azul Oscuro - "8") -->
    <rect x="336" y="48" width="128" height="128" rx="28" fill="#1e3a8a" />
    <text x="400" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Bloque Medio Izquierdo (Turquesa - "5") -->
    <rect x="48" y="192" width="128" height="128" rx="28" fill="#14b8a6" />
    <text x="112" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#0f172a" text-anchor="middle">5</text>

    <!-- Bloque Medio Centro (Naranja - "8") -->
    <rect x="192" y="192" width="128" height="128" rx="28" fill="#f97316" />
    <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Bloque Medio Derecho (Amarillo - "9") -->
    <rect x="336" y="192" width="128" height="128" rx="28" fill="#f59e0b" />
    <text x="400" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#0f172a" text-anchor="middle">9</text>

    <!-- Bloque Inferior Izquierdo (Coral/Rosa - "2") -->
    <rect x="48" y="336" width="128" height="128" rx="28" fill="#f43f5e" />
    <text x="112" y="422" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#ffffff" text-anchor="middle">2</text>

    <!-- Bloque Inferior Centro (Amarillo - "8") -->
    <rect x="192" y="336" width="128" height="128" rx="28" fill="#f59e0b" />
    <text x="256" y="422" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#0f172a" text-anchor="middle">8</text>

    <!-- Bloque Inferior Derecho (Azul - "4") -->
    <rect x="336" y="336" width="128" height="128" rx="28" fill="#2563eb" />
    <text x="400" y="422" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="94" fill="#ffffff" text-anchor="middle">4</text>
  </g>
</svg>